<svg viewBox="0 0 480 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstrakt illustration af luftveje">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0ea5a5"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff5ff"/>
      <stop offset="1" stop-color="#e6f7f7"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop -->
  <rect x="20" y="20" width="440" height="360" rx="28" fill="url(#gSky)"/>

  <!-- concentric breathing rings -->
  <circle cx="240" cy="200" r="150" fill="none" stroke="#2563eb" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="240" cy="200" r="118" fill="none" stroke="#2563eb" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="240" cy="200" r="86"  fill="none" stroke="#0ea5a5" stroke-opacity="0.14" stroke-width="2"/>

  <!-- central trachea -->
  <rect x="233" y="96" width="14" height="70" rx="7" fill="url(#gBlue)"/>
  <rect x="226" y="104" width="28" height="4" rx="2" fill="#fff" fill-opacity="0.6"/>
  <rect x="226" y="116" width="28" height="4" rx="2" fill="#fff" fill-opacity="0.6"/>
  <rect x="226" y="128" width="28" height="4" rx="2" fill="#fff" fill-opacity="0.6"/>

  <!-- left lung lobe (rounded organic blob) -->
  <path d="M232 166c-6-8-18-10-30-6-22 7-44 26-52 54-7 25-4 52 10 66 10 10 26 12 40 6 16-7 26-24 30-44 4-22 6-52 2-76z"
        fill="url(#gBlue)"/>
  <!-- right lung lobe -->
  <path d="M248 166c6-8 18-10 30-6 22 7 44 26 52 54 7 25 4 52-10 66-10 10-26 12-40 6-16-7-26-24-30-44-4-22-6-52-2-76z"
        fill="url(#gTeal)"/>

  <!-- airway branches left -->
  <g stroke="#fff" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M226 176c-6 8-10 20-10 34"/>
    <path d="M216 210c-8 2-16 8-20 16"/>
    <path d="M216 210c-2 10-2 22 2 32"/>
    <path d="M226 176c-10-2-20 0-28 6"/>
  </g>
  <!-- airway branches right -->
  <g stroke="#fff" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M254 176c6 8 10 20 10 34"/>
    <path d="M264 210c8 2 16 8 20 16"/>
    <path d="M264 210c2 10 2 22-2 32"/>
    <path d="M254 176c10-2 20 0 28 6"/>
  </g>

  <!-- alveoli dots -->
  <circle cx="188" cy="226" r="5" fill="#fff" fill-opacity="0.9"/>
  <circle cx="200" cy="248" r="4" fill="#fff" fill-opacity="0.8"/>
  <circle cx="292" cy="226" r="5" fill="#fff" fill-opacity="0.9"/>
  <circle cx="280" cy="248" r="4" fill="#fff" fill-opacity="0.8"/>

  <!-- floating pollen / particles -->
  <circle cx="96"  cy="120" r="7" fill="#2563eb" fill-opacity="0.18"/>
  <circle cx="392" cy="110" r="10" fill="#0ea5a5" fill-opacity="0.18"/>
  <circle cx="400" cy="300" r="6" fill="#2563eb" fill-opacity="0.2"/>
  <circle cx="88"  cy="300" r="9" fill="#0ea5a5" fill-opacity="0.16"/>
</svg>
